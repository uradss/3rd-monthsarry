<!DOCTYPE html>
<html lang="tl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy 3rd Monthsarry</title>
<link rel="icon" type="image/x-icon" href="src/assets/images/heart.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="stage" id="stage">
  <canvas id="heart" aria-hidden="true"></canvas>
  <h1>Hi baby Happy 3rd Monthsarry <span>&#9829;</span></h1>
  <p class="for">para sa <b id="herName">baby ko</b></p>
  <button id="openLetter" class="core" aria-label="Buksan ang love letter"><i>&#9993;</i></button>

  <div class="dock"><aside class="card player">
    <div class="cover" id="cover"><span>&#9825;</span></div>
    <h3 id="title">Pumili ng kanta</h3>
    <p id="artist"></p>
    <div class="wave" id="wave"></div>
    <div class="bar"><span id="cur">0:00</span><input type="range" id="seek" min="0" max="100" value="0" step="0.1" aria-label="Progress"><span id="dur">0:00</span></div>
    <div class="ctrl">
      <button id="prev" aria-label="Nakaraan">&#9198;</button>
      <button id="play" class="big" aria-label="Play">&#9654;</button>
      <button id="next" aria-label="Susunod">&#9197;</button>
    </div>
    <div class="vol"><span>&#9834;</span><input type="range" id="vol" min="0" max="1" step="0.01" value="0.7" aria-label="Volume"></div>
  </aside></div>
  <audio id="audio" preload="metadata"></audio>
</header>

<dialog id="modal">
  <form method="dialog"><button class="x" aria-label="Isara">&#10005;</button></form>
  <h3 id="mTitle"></h3><small id="mDate"></small>
  <div id="mBody"></div>
</dialog>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="script.js"></script>
</body>
</html>
